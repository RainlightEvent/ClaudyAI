<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c; --panel:#0f0f17; --panel2:#14141f; --panel3:#1a1a26;
  --border:#23232f; --border2:#2e2e3d;
  --text:#e8e8f0; --muted:#8a8a9c; --dim:#5c5c70;
  --accent:#7c5cff; --accent2:#22d3ee; --ok:#34d399; --warn:#fbbf24;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}

/* ============ CANVAS ============ */
#canvasWrap{position:fixed;inset:0;overflow:hidden;cursor:grab}
#canvasWrap.dragging{cursor:grabbing}
#canvas{
  position:absolute; top:0; left:0; width:5000px; height:4000px;
  transform-origin:0 0;
  background-image:radial-gradient(circle,#17171f 1.2px,transparent 1.2px);
  background-size:32px 32px;
}
#connectors{position:absolute;top:0;left:0;width:5000px;height:4000px;pointer-events:none}
#connectors path{
  fill:none; stroke:#2e2e3d; stroke-width:2; stroke-dasharray:6 6;
  opacity:0; transition:opacity .6s;
}
#connectors path.on{opacity:1; animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:-400}}

/* ============ NODES ============ */
.node{
  position:absolute; background:var(--panel);
  border:1px solid var(--border); border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0; transform:translateY(14px) scale(.97);
  transition:opacity .45s cubic-bezier(.2,.8,.3,1), transform .45s cubic-bezier(.2,.8,.3,1), border-color .2s, box-shadow .2s;
  overflow:hidden;
}
.node.in{opacity:1; transform:translateY(0) scale(1)}
.node.sel{border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,92,255,.16),0 20px 60px rgba(0,0,0,.5)}
.node-head{
  display:flex; align-items:center; gap:8px;
  padding:12px 16px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#13131d,#0f0f17);
}
.node-dot{width:7px;height:7px;border-radius:50%;flex:none}
.node-title{font-weight:600;font-size:12.5px;letter-spacing:.2px}
.node-sub{font-size:11px;color:var(--dim);margin-left:auto;font-family:'JetBrains Mono',monospace}
.node-body{padding:16px}

/* script */
.screenplay{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.85;color:#c8c8d8;white-space:pre-wrap}
.screenplay .slug{color:var(--accent2);font-weight:600}
.screenplay .char{color:var(--warn)}
.caret{display:inline-block;width:6px;height:13px;background:var(--accent);vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* scenes */
.scene-grid{display:flex;flex-direction:column;gap:8px}
.scene{
  display:flex;gap:10px;align-items:center;padding:9px 11px;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  opacity:0;transform:translateX(-8px);transition:all .4s;
}
.scene.in{opacity:1;transform:none}
.scene-num{
  width:22px;height:22px;border-radius:6px;flex:none;
  background:rgba(124,92,255,.14);color:var(--accent);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
}
.scene-txt{font-size:12px;line-height:1.4;color:#d0d0de}
.scene-meta{font-size:10px;color:var(--dim);margin-top:2px;font-family:'JetBrains Mono',monospace}

/* cast */
.cast-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cast-card{
  background:var(--panel2);border:1px solid var(--border);border-radius:12px;
  padding:10px;opacity:0;transform:scale(.94);transition:all .4s;
}
.cast-card.in{opacity:1;transform:none}
.cast-av{width:100%;aspect-ratio:1.35;border-radius:8px;margin-bottom:9px;position:relative;overflow:hidden}
.cast-av::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),transparent 60%)}
.cast-name{font-size:12px;font-weight:600;margin-bottom:3px}
.cast-role{font-size:10.5px;color:var(--muted);line-height:1.4}
.cast-tags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(124,92,255,.13);color:#a08cff;font-weight:500}

/* world */
.palette{display:flex;gap:6px;margin-bottom:12px}
.sw{flex:1;height:38px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.world-list{display:flex;flex-direction:column;gap:7px}
.world-item{
  display:flex;gap:9px;align-items:center;padding:8px 10px;
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  font-size:11.5px;opacity:0;transform:translateY(6px);transition:all .4s;
}
.world-item.in{opacity:1;transform:none}
.world-ic{width:26px;height:26px;border-radius:7px;flex:none;background:var(--panel3);
  display:grid;place-items:center;font-size:13px}

/* storyboard */
.sb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sb{
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  overflow:hidden;opacity:0;transform:scale(.93);transition:all .4s;
}
.sb.in{opacity:1;transform:none}
.sb-img{aspect-ratio:16/9;position:relative}
.sb-img::after{content:'';position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,255,255,.1),transparent 55%)}
.sb-cap{padding:6px 7px;font-size:9.5px;color:var(--muted);line-height:1.35}
.sb-n{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:8.5px}

/* timeline */
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:flex;align-items:center;gap:9px}
.track-lbl{width:52px;font-size:9.5px;color:var(--dim);font-family:'JetBrains Mono',monospace;flex:none;text-transform:uppercase;letter-spacing:.5px}
.track-lane{flex:1;height:26px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
.clip{
  position:absolute;top:3px;bottom:3px;border-radius:4px;
  opacity:0;transition:opacity .5s;
}
.clip.in{opacity:1}
.playhead{position:absolute;top:0;bottom:0;width:1.5px;background:var(--accent2);
  box-shadow:0 0 8px var(--accent2);animation:play 8s linear infinite}
@keyframes play{from{left:0}to{left:100%}}
.prog{margin-top:14px}
.prog-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.bar{height:5px;background:var(--panel3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

/* ============ TOP BAR ============ */
.topbar{
  position:fixed;top:calc(16px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;padding:6px;
  max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;
  background:rgba(15,15,23,.82);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.topbar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;border-right:1px solid var(--border);margin-right:4px;flex:none}
.brand-ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:11px}
.brand-name{font-weight:700;font-size:12.5px;letter-spacing:-.2px}
.phase{
  padding:7px 13px;border-radius:9px;font-size:12px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:all .18s;border:1px solid transparent;
  white-space:nowrap;
}
.phase:hover{color:var(--text);background:var(--panel2)}
.phase.on{background:rgba(124,92,255,.16);color:#b4a3ff;border-color:rgba(124,92,255,.3)}
.phase.done{color:var(--ok)}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 4px;flex:none}
.tb-btn{
  padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),#6d4dff);color:#fff;
  cursor:pointer;border:none;transition:filter .18s;font-family:inherit;flex:none;
}
.tb-btn:hover{filter:brightness(1.15)}
.tb-btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.tb-btn.ghost:hover{color:var(--text)}

/* ============ CHAT DOCK ============ */
.dock{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);
  width:min(760px,calc(100vw - 32px));z-index:60;
  display:flex;flex-direction:column;gap:0;
}
.thread{
  display:flex;flex-direction:column;gap:12px;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .45s cubic-bezier(.2,.8,.3,1), opacity .3s, margin .3s;
  margin-bottom:0;
}
.thread.open{max-height:44vh;opacity:1;margin-bottom:12px;overflow-y:auto;padding-right:4px}
.thread::-webkit-scrollbar{width:5px}
.thread::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.msg{display:flex;gap:10px;animation:msgIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.av{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;
}
.av.user{background:var(--panel3);color:var(--muted);border:1px solid var(--border);font-size:9px}
.av.ai{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bubble{
  background:rgba(20,20,31,.9);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:13px;
  padding:11px 14px;font-size:12.5px;line-height:1.6;color:#d6d6e4;
  max-width:calc(100% - 40px);min-width:0;
}
.msg.user .bubble{background:rgba(124,92,255,.11);border-color:rgba(124,92,255,.22);color:#ded8ff}
.bubble b{color:#fff;font-weight:600}
.bubble .hl{color:var(--accent2);font-family:'JetBrains Mono',monospace;font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{
  font-size:10.5px;padding:4px 9px;border-radius:7px;
  background:var(--panel3);border:1px solid var(--border2);color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* composer */
.composer{
  background:rgba(15,15,23,.9);backdrop-filter:blur(24px);
  border:1px solid var(--border2);border-radius:16px;
  box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset;
  transition:border-color .25s, box-shadow .25s;
}
.composer:focus-within{border-color:rgba(124,92,255,.5);box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 3px rgba(124,92,255,.1)}
.ctx{
  display:none;align-items:center;gap:7px;padding:8px 14px 0;
  font-size:10.5px;color:var(--accent);font-family:'JetBrains Mono',monospace;
}
.ctx.on{display:flex}
.ctx-x{margin-left:auto;color:var(--dim);cursor:pointer;font-size:13px}
.ctx-x:hover{color:var(--text)}
.c-row{display:flex;align-items:flex-end;gap:8px;padding:11px 11px 11px 15px}
#input{
  flex:1;min-width:0;background:none;border:none;outline:none;resize:none;
  color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.55;
  max-height:130px;padding:5px 0;
}
#input::placeholder{color:var(--dim)}
.send{
  width:34px;height:34px;border-radius:10px;flex:none;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#6d4dff);color:#fff;
  display:grid;place-items:center;transition:all .18s;
}
.send:hover{filter:brightness(1.15);transform:translateY(-1px)}
.send:disabled{opacity:.3;cursor:not-allowed;transform:none}
.send svg{width:15px;height:15px}
button:focus-visible,.phase:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* zoom */
.zoom{
  position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom, 0px));z-index:55;
  display:flex;flex-direction:column;gap:1px;
  background:rgba(15,15,23,.85);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:11px;overflow:hidden;
}
.zoom button{
  width:36px;height:34px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:15px;transition:all .15s;
}
.zoom button:hover{background:var(--panel2);color:var(--text)}
.zoom .zt{font-size:10px;font-family:'JetBrains Mono',monospace;border-top:1px solid var(--border);cursor:default;color:var(--muted);text-align:center;padding:8px 0}
@media (max-width:900px){ .zoom{display:none} }

/* hint */
.hint{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--dim);pointer-events:none;
  transition:opacity .5s;
}
.hint h2{font-size:22px;font-weight:600;color:#3a3a4a;margin-bottom:8px;letter-spacing:-.4px}
.hint p{font-size:12.5px;line-height:1.7}
.hint kbd{
  background:var(--panel2);border:1px solid var(--border2);border-radius:5px;
  padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="canvasWrap">
  <div id="canvas">
    <svg id="connectors"></svg>
    <div class="hint" id="hint">
      <h2>Your canvas is empty</h2>
      <p>Type an idea or paste a story below.<br>
      Press <kbd>Enter</kbd> to send · <kbd>drag</kbd> to pan · <kbd>scroll</kbd> to zoom</p>
    </div>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="brand-ic">◆</div>
    <div class="brand-name">StoryForge</div>
  </div>
  <div class="phase" data-t="script">Script</div>
  <div class="phase" data-t="scenes">Scenes</div>
  <div class="phase" data-t="cast">Cast</div>
  <div class="phase" data-t="world">World</div>
  <div class="phase" data-t="storyboard">Storyboard</div>
  <div class="phase" data-t="timeline">Timeline</div>
  <div class="tb-sep"></div>
  <button class="tb-btn ghost" onclick="fitAll()">Fit</button>
  <button class="tb-btn" onclick="exportVid()">Export</button>
</header>

<div class="zoom">
  <button onclick="zoomBy(1.2)" aria-label="Zoom in">+</button>
  <button onclick="zoomBy(1/1.2)" aria-label="Zoom out">−</button>
  <div class="zt" id="zoomLabel">100%</div>
</div>

<div class="dock">
  <div class="thread" id="thread"></div>
  <div class="composer">
    <div class="ctx" id="ctx">
      <span>◆</span><span id="ctxLabel"></span>
      <span class="ctx-x" onclick="clearSel()">✕</span>
    </div>
    <div class="c-row">
      <textarea id="input" rows="1" placeholder="Describe your story, or paste an existing one…"></textarea>
      <button class="send" id="send" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ═══════════════ STATE ═══════════════ */
const S = {
  tx: 0, ty: 0, scale: 1,
  nodes: {},
  sel: null,
  running: false,
  done: false
};

const NODE_POS = {
  script:     {x:80,  y:80,   w:480, h:560},
  scenes:     {x:640, y:80,   w:560, h:560},
  cast:       {x:80,  y:700,  w:520, h:460},
  world:      {x:680, y:700,  w:520, h:460},
  storyboard: {x:80,  y:1220, w:800, h:520},
  timeline:   {x:960, y:1220, w:560, h:460}
};

const CONNECTORS = [
  ['script','scenes',     'M560,360 L640,360'],
  ['scenes','cast',       'M920,640 C920,690 340,650 340,700'],
  ['cast','world',        'M600,930 L680,930'],
  ['world','storyboard',  'M1200,1160 C1200,1205 480,1175 480,1220'],
  ['storyboard','timeline','M880,1480 L960,1480']
];

const canvas = document.getElementById('canvas');
const wrap   = document.getElementById('canvasWrap');
const svg    = document.getElementById('connectors');
const thread = document.getElementById('thread');
const input  = document.getElementById('input');
const sendBtn= document.getElementById('send');
const ctxEl  = document.getElementById('ctx');
const ctxLbl = document.getElementById('ctxLabel');
const hint   = document.getElementById('hint');

/* ═══════════════ CANVAS TRANSFORM ═══════════════ */
function apply(){
  canvas.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
  document.getElementById('zoomLabel').textContent = Math.round(S.scale*100)+'%';
}

let anim = null;
function flyTo(x,y,w,h,pad=120){
  const vw = innerWidth, vh = innerHeight - 60;
  pad = Math.min(pad, vw*0.08);
  const s = Math.min((vw-pad*2)/w, (vh-pad*2)/h, 1.15);
  const tx = vw/2 - (x + w/2)*s;
  const ty = (vh/2) - (y + h/2)*s + 10;
  animateTo(tx,ty,s);
}

function animateTo(tx,ty,s){
  cancelAnimationFrame(anim);
  const f = {tx:S.tx, ty:S.ty, s:S.scale}, t0 = performance.now(), dur = 720;
  const ease = t => 1-Math.pow(1-t,3);
  (function step(now){
    const p = Math.min(1,(now-t0)/dur), e = ease(p);
    S.tx = f.tx+(tx-f.tx)*e;
    S.ty = f.ty+(ty-f.ty)*e;
    S.scale = f.s+(s-f.s)*e;
    apply();
    if(p<1) anim = requestAnimationFrame(step);
  })(t0);
}

function fitAll(){
  const keys = Object.keys(S.nodes);
  if(!keys.length){ animateTo(innerWidth/2-400, innerHeight/2-300, 1); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  keys.forEach(k=>{
    const p=NODE_POS[k];
    x0=Math.min(x0,p.x); y0=Math.min(y0,p.y);
    x1=Math.max(x1,p.x+p.w); y1=Math.max(y1,p.y+p.h);
  });
  flyTo(x0,y0,x1-x0,y1-y0,90);
}

function zoomBy(f){
  const cx=innerWidth/2, cy=innerHeight/2;
  const ns = Math.max(.15, Math.min(2.2, S.scale*f));
  S.tx = cx - (cx-S.tx)*(ns/S.scale);
  S.ty = cy - (cy-S.ty)*(ns/S.scale);
  S.scale = ns; apply();
}

/* pan (mouse + touch via pointer events) */
let drag=null;
wrap.addEventListener('pointerdown', e=>{
  if(e.target.closest('.node')) return;
  drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty};
  wrap.classList.add('dragging');
});
addEventListener('pointermove', e=>{
  if(!drag) return;
  S.tx = drag.tx + (e.clientX-drag.x);
  S.ty = drag.ty + (e.clientY-drag.y);
  apply();
});
addEventListener('pointerup', ()=>{ drag=null; wrap.classList.remove('dragging'); });
wrap.style.touchAction='none';

wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1/1.1;
  const ns = Math.max(.15, Math.min(2.2, S.scale*f));
  S.tx = e.clientX - (e.clientX-S.tx)*(ns/S.scale);
  S.ty = e.clientY - (e.clientY-S.ty)*(ns/S.scale);
  S.scale = ns; apply();
}, {passive:false});

/* ═══════════════ NODE CREATION ═══════════════ */
function makeNode(key, title, sub, bodyHTML){
  if(S.nodes[key]) return S.nodes[key].el;
  const p = NODE_POS[key];
  const el = document.createElement('div');
  el.className = 'node';
  el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
  el.innerHTML = `
    <div class="node-head">
      <div class="node-dot" style="background:${dotColor(key)}"></div>
      <div class="node-title">${title}</div>
      <div class="node-sub">${sub||''}</div>
    </div>
    <div class="node-body">${bodyHTML}</div>`;
  el.addEventListener('pointerdown', e=>{ e.stopPropagation(); select(key); });
  canvas.appendChild(el);
  S.nodes[key] = {el};
  requestAnimationFrame(()=> setTimeout(()=> el.classList.add('in'), 30));
  drawConnectors();
  markPhase(key);
  return el;
}

function dotColor(k){
  return {script:'#22d3ee',scenes:'#7c5cff',cast:'#fbbf24',
          world:'#34d399',storyboard:'#f472b6',timeline:'#818cf8'}[k]||'#7c5cff';
}

function drawConnectors(){
  svg.innerHTML = CONNECTORS.map(([a,b,d])=>{
    const on = S.nodes[a] && S.nodes[b];
    return `<path d="${d}" class="${on?'on':''}"/>`;
  }).join('');
}

function markPhase(key){
  const btns=[...document.querySelectorAll('.phase')];
  const order=['script','scenes','cast','world','storyboard','timeline'];
  const idx=order.indexOf(key);
  btns.forEach(b=>{
    const i=order.indexOf(b.dataset.t);
    if(i<idx) b.classList.add('done');
    b.classList.toggle('on', b.dataset.t===key);
  });
}

document.querySelectorAll('.phase').forEach(b=>{
  b.onclick = ()=>{
    const k=b.dataset.t;
    if(!S.nodes[k]) return;
    const p=NODE_POS[k];
    flyTo(p.x,p.y,p.w,p.h);
    markPhase(k);
    select(k);
  };
});

function select(key){
  Object.values(S.nodes).forEach(n=>n.el.classList.remove('sel'));
  if(S.nodes[key]) S.nodes[key].el.classList.add('sel');
  S.sel = key;
  const names={script:'Script',scenes:'Scene List',cast:'Cast',world:'World',storyboard:'Storyboard',timeline:'Timeline'};
  ctxLbl.textContent = names[key] + ' selected — edits apply to this';
  ctxEl.classList.add('on');
}
function clearSel(){
  Object.values(S.nodes).forEach(n=>n.el.classList.remove('sel'));
  S.sel=null; ctxEl.classList.remove('on');
}

/* ═══════════════ CHAT ═══════════════ */
function msg(role, html){
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':'ai');
  d.innerHTML=`
    <div class="av ${role==='user'?'user':'ai'}">${role==='user'?'You':'◆'}</div>
    <div class="bubble">${html}</div>`;
  thread.appendChild(d);
  thread.classList.add('open');
  thread.scrollTop = thread.scrollHeight;
  return d;
}

function typing(){
  const d=document.createElement('div');
  d.className='msg ai';
  d.innerHTML=`<div class="av ai">◆</div>
    <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
  thread.appendChild(d); thread.classList.add('open');
  thread.scrollTop = thread.scrollHeight;
  return d;
}

const wait = ms => new Promise(r=>setTimeout(r,ms));

function exportVid(){
  if(S.running){ msg('ai','Still generating — export unlocks when the render reaches 100%.'); return; }
  if(!S.done){ msg('ai','Nothing to export yet. Send a story idea first and I\'ll build the film.'); return; }
  msg('ai', `Export queued: <span class="hl">storyforge_cut_v1.mp4</span> · 1080p · 24fps · H.264 + stereo mix. (Demo — no file is produced.)`);
}

/* ═══════════════ WORKFLOW ═══════════════ */
async function run(idea){
  S.running=true; sendBtn.disabled=true;
  hint.style.opacity='0'; setTimeout(()=>hint.remove(),500);

  msg('user', idea.replace(/</g,'&lt;'));

  /* 1 — SCRIPT */
  let t = typing(); await wait(900); t.remove();
  msg('ai', `Expanding your idea into a full screenplay. Structuring it as a <b>3-act short</b> — roughly 4 minutes of screen time, expandable to 30.`);
  await wait(500);

  makeNode('script','Screenplay','draft v1', `<div class="screenplay" id="sp"></div>`);
  const p = NODE_POS.script; flyTo(p.x,p.y,p.w,p.h);
  await wait(300);

  const SCREENPLAY =
`FADE IN:

<span class="slug">EXT. NEON HARBOR — NIGHT</span>

Rain on chrome. A city that never
learned to sleep.

<span class="char">ARIA</span> (28, courier, wired)
stands at the edge, a package
clutched to her chest.

<span class="char">ARIA</span>
    (quiet)
  It's not the drop.
  It's who's waiting.

A drone hums overhead. She runs.

<span class="slug">INT. UNDERGROUND MARKET — CONTINUOUS</span>

Stalls of stolen light. <span class="char">KAI</span>
(40s, ex-engineer) looks up.

<span class="char">KAI</span>
  You're late. They already know.

<span class="slug">EXT. ROOFTOP — DAWN</span>

The package opens. It's not data.
It's a child's voice, recorded.

<span class="char">ARIA</span>
  We have to give it back.

CUT TO BLACK.`;

  const sp = document.getElementById('sp');
  let i=0;
  const plain = SCREENPLAY.split(/(<[^>]+>)/g);
  let buf='', tokens=[];
  plain.forEach(seg=>{
    if(seg.startsWith('<')) tokens.push({tag:true,v:seg});
    else for(const ch of seg) tokens.push({tag:false,v:ch});
  });
  await new Promise(res=>{
    const iv=setInterval(()=>{
      // emit up to 3 visible chars per tick (tags pass through instantly)
      let n=0;
      while(i<tokens.length && n<3){
        buf += tokens[i].v;
        if(!tokens[i].tag) n++;
        i++;
      }
      if(i>=tokens.length){ sp.innerHTML=buf; clearInterval(iv); res(); return; }
      sp.innerHTML = buf + '<span class="caret"></span>';
    }, 8);
  });

  msg('ai', `Script locked — <span class="hl">3 acts · 6 scenes · 847 words</span>. Breaking it into production scenes now.`);
  await wait(700);

  /* 2 — SCENES */
  t = typing(); await wait(750); t.remove();
  const scenes = [
    ['1','EXT. NEON HARBOR — NIGHT','Aria waits with the package','0:42'],
    ['2','EXT. HARBOR ROOFTOP — NIGHT','Drone pursues; first chase','0:55'],
    ['3','INT. UNDERGROUND MARKET','Kai warns her','0:38'],
    ['4','INT. MARKET — BACK ROOM','The package is opened','1:02'],
    ['5','EXT. ROOFTOP — DAWN','The recording plays','0:47'],
    ['6','EXT. CITY EDGE — DAWN','Decision & cut to black','0:36']
  ];
  makeNode('scenes','Scene Breakdown','6 scenes', `<div class="scene-grid" id="sg"></div>`);
  const q = NODE_POS.scenes; flyTo(q.x,q.y,q.w,q.h);
  const sg = document.getElementById('sg');
  for(const s of scenes){
    sg.insertAdjacentHTML('beforeend',`
      <div class="scene">
        <div class="scene-num">${s[0]}</div>
        <div style="flex:1">
          <div class="scene-txt">${s[2]}</div>
          <div class="scene-meta">${s[1]} · ${s[3]}</div>
        </div>
      </div>`);
    await wait(110);
    sg.lastElementChild.classList.add('in');
  }
  msg('ai', `6 scenes ready. Extracting <b>cast</b> and building the <b>world bible</b> in parallel.`);
  await wait(650);

  /* 3 — CAST */
  t=typing(); await wait(700); t.remove();
  makeNode('cast','Cast','4 characters', `<div class="cast-grid" id="cg"></div>`);
  const c=NODE_POS.cast; flyTo(c.x,c.y,c.w,c.h);
  const cast=[
    ['Aria','Courier · Protagonist','#7c5cff','#22d3ee',['determined','wired','28']],
    ['Kai','Ex-engineer · Ally','#fbbf24','#f472b6',['guarded','brilliant','40s']],
    ['The Broker','Antagonist · Voice only','#ef4444','#7c5cff',['unseen','patient']],
    ['The Child','Recording · Memory','#34d399','#22d3ee',['absent','central']]
  ];
  const cg=document.getElementById('cg');
  for(const [name,role,c1,c2,tags] of cast){
    cg.insertAdjacentHTML('beforeend',`
      <div class="cast-card">
        <div class="cast-av" style="background:linear-gradient(135deg,${c1},${c2})"></div>
        <div class="cast-name">${name}</div>
        <div class="cast-role">${role}</div>
        <div class="cast-tags">${tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
      </div>`);
    await wait(130); cg.lastElementChild.classList.add('in');
  }
  msg('ai', `4 characters cast with locked reference sheets — consistency enforced across every shot.`);
  await wait(600);

  /* 4 — WORLD */
  t=typing(); await wait(700); t.remove();
  makeNode('world','World Bible','style locked', `
    <div class="palette">
      <div class="sw" style="background:#0b1220"></div>
      <div class="sw" style="background:#7c5cff"></div>
      <div class="sw" style="background:#22d3ee"></div>
      <div class="sw" style="background:#f472b6"></div>
      <div class="sw" style="background:#fbbf24"></div>
    </div>
    <div class="world-list" id="wl"></div>`);
  const w=NODE_POS.world; flyTo(w.x,w.y,w.w,w.h);
  const world=[
    ['🌧','Neon Harbor — rain-soaked, chrome, permanent night'],
    ['🏮','Underground Market — stolen light, tight corridors'],
    ['🌆','Rooftops — fog, distant towers, no horizon'],
    ['🎞','Style — anamorphic, cyberpunk noir, 2.39:1']
  ];
  const wl=document.getElementById('wl');
  for(const[ic,txt]of world){
    wl.insertAdjacentHTML('beforeend',`<div class="world-item"><div class="world-ic">${ic}</div><div>${txt}</div></div>`);
    await wait(120); wl.lastElementChild.classList.add('in');
  }
  msg('ai', `World bible complete. Generating the <b>storyboard</b> — 8 panels across the 6 scenes.`);
  await wait(650);

  /* 5 — STORYBOARD */
  t=typing(); await wait(900); t.remove();
  makeNode('storyboard','Storyboard','8 panels', `<div class="sb-grid" id="sbg"></div>`);
  const sb=NODE_POS.storyboard; flyTo(sb.x,sb.y,sb.w,sb.h);
  const panels=[
    ['01','Wide — Aria at harbor edge','#7c5cff','#22d3ee'],
    ['02','CU — package in her hands','#22d3ee','#7c5cff'],
    ['03','Drone POV — descending','#f472b6','#7c5cff'],
    ['04','Tracking — she runs','#7c5cff','#f472b6'],
    ['05','Kai looks up from bench','#fbbf24','#f472b6'],
    ['06','Insert — package opens','#22d3ee','#34d399'],
    ['07','CU — Aria hears the voice','#34d399','#22d3ee'],
    ['08','Wide — rooftop, dawn breaks','#fbbf24','#f472b6']
  ];
  const sbg=document.getElementById('sbg');
  for(const n of panels){
    sbg.insertAdjacentHTML('beforeend',`
      <div class="sb">
        <div class="sb-img" style="background:linear-gradient(140deg,${n[2]},${n[3]})"></div>
        <div class="sb-cap"><span class="sb-n">${n[0]}</span> ${n[1]}</div>
      </div>`);
    await wait(90); sbg.lastElementChild.classList.add('in');
  }
  msg('ai', `Storyboard done. Dispatching to <b>video</b> and <b>audio</b> agents — this runs in the background.`);
  await wait(600);

  /* 6 — TIMELINE */
  t=typing(); await wait(800); t.remove();
  makeNode('timeline','Render Timeline','4:18 target', `
    <div class="tracks" id="tk"></div>
    <div class="prog">
      <div class="prog-row"><span>Rendering 6 scenes · 8 shots</span><span id="pct">0%</span></div>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
    </div>`);
  const tl=NODE_POS.timeline; flyTo(tl.x,tl.y,tl.w,tl.h);
  const tk=document.getElementById('tk');
  const tracks=[
    ['VIDEO', [[0,18,'#7c5cff'],[19,20,'#22d3ee'],[40,17,'#f472b6'],[58,22,'#7c5cff'],[81,19,'#34d399']]],
    ['AUDIO', [[0,38,'#fbbf24'],[40,60,'#34d399']]],
    ['MUSIC', [[0,100,'#2e2e3d']]]
  ];
  for(const[lbl,clips]of tracks){
    tk.insertAdjacentHTML('beforeend',`
      <div class="track">
        <div class="track-lbl">${lbl}</div>
        <div class="track-lane">
          ${clips.map(c=>`<div class="clip" style="left:${c[0]}%;width:${c[1]}%;background:${c[2]}"></div>`).join('')}
          <div class="playhead"></div>
        </div>
      </div>`);
    await wait(150);
    tk.querySelectorAll('.clip').forEach(c=>c.classList.add('in'));
  }

  /* progress */
  const bar=document.getElementById('bar'), pct=document.getElementById('pct');
  for(let v=0;v<100;v+=Math.random()*11+4){
    bar.style.width=v+'%'; pct.textContent=Math.round(v)+'%';
    await wait(190);
  }
  bar.style.width='100%'; pct.textContent='100%';

  /* done */
  document.querySelectorAll('.phase').forEach(b=>b.classList.add('done'));
  msg('ai', `Done. <b>4:18 · 1080p · 24fps</b> rendered with dialogue, score and sound design.`);
  const last = thread.lastElementChild.querySelector('.bubble');
  last.insertAdjacentHTML('beforeend', `
    <div class="chips">
      <span class="chip">4:18 runtime</span>
      <span class="chip">6 scenes</span>
      <span class="chip">8 shots</span>
      <span class="chip">1080p</span>
    </div>
    <div class="chips" style="margin-top:10px">
      <span class="chip" style="cursor:pointer;border-color:rgba(124,92,255,.4);color:#b4a3ff">▶ Preview</span>
      <span class="chip" style="cursor:pointer">↻ Regenerate scene 4</span>
      <span class="chip" style="cursor:pointer">＋ Extend to 10 min</span>
      <span class="chip" style="cursor:pointer" onclick="exportVid()">⬇ Download</span>
    </div>`);
  thread.scrollTop=thread.scrollHeight;
  fitAll();

  S.running=false; S.done=true; sendBtn.disabled = !input.value.trim();
}

/* ═══════════════ COMPOSER ═══════════════ */
input.addEventListener('input', ()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,130)+'px';
  sendBtn.disabled = !input.value.trim() || S.running;
});
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    if(!sendBtn.disabled) fire();
  }
});
sendBtn.onclick = fire;

function fire(){
  const v = input.value.trim();
  if(!v || S.running) return;
  input.value=''; input.style.height='auto';
  sendBtn.disabled=true;
  if(Object.keys(S.nodes).length){
    msg('user', v.replace(/</g,'&lt;'));
    setTimeout(()=>{
      msg('ai','Got it — applying that to the selected element and regenerating downstream.');
    },600);
  } else {
    run(v);
  }
}

/* ═══════════════ INIT ═══════════════ */
S.tx = innerWidth/2 - 700;
S.ty = innerHeight/2 - 500;
apply();

/* pre-fill a sample idea so it's one click to see the flow */
input.value = "A courier in a rain-soaked neon city discovers the package she's carrying contains a child's recorded voice — and has to decide whether to deliver it or give it back.";
input.dispatchEvent(new Event('input'));
</script>

</html>
